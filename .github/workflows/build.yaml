name: "Build e publicação de release"

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Tipo de release"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  # -------------------------
  # 1) Calcula a próxima versão
  # -------------------------
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.semver.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar última tag
        id: last
        run: |
          if git describe --tags --abbrev=0 2>/dev/null; then
            echo "tag=$(git describe --tags --abbrev=0)" >> $GITHUB_OUTPUT
          else
            echo "tag=v0.0.0" >> $GITHUB_OUTPUT
          fi

      - name: Criar versão
        id: semver
        run: |
          echo "Tag atual: ${{ steps.last.outputs.tag }}"
          CURR="${{ steps.last.outputs.tag }}"
          CURR="${CURR#v}"
          IFS='.' read -r major minor patch <<< "$CURR"

          case "${{ github.event.inputs.release_type }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac

          new_tag="v$major.$minor.$patch"
          echo "Nova tag: $new_tag"
          echo "tag=$new_tag" >> $GITHUB_OUTPUT

  # -------------------------
  # 2) Compila com PlatformIO
  # -------------------------
  build:
    runs-on: ubuntu-latest
    needs: version
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar PlatformIO
        run: pip install -U platformio

      - name: Build firmware
        run: pio run
        env:
          VERSION: ${{ needs.version.outputs.tag }}

      - name: Upload artefatos
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            .pio/build/**/firmware.bin
            .pio/build/**/bootloader.bin
            .pio/build/**/partitions.bin
          if-no-files-found: error

  # -------------------------
  # 3) Cria tag e Release
  # -------------------------
  release:
    runs-on: ubuntu-latest
    needs: [version, build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar git
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Baixar artefatos
        uses: actions/download-artifact@v4
        with:
          name: firmware
          path: ./firmware

      - name: Criar e enviar tag
        run: |
          git tag -a ${{ needs.version.outputs.tag }} -m "Release ${{ needs.version.outputs.tag }}"
          git push origin ${{ needs.version.outputs.tag }}

      - name: Criar release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Release ${{ needs.version.outputs.tag }}
          body: |
            - Tipo: ${{ github.event.inputs.release_type }}
            - Commit: ${{ github.sha }}
          files: ./firmware/**
